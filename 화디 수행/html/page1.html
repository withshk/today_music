<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>질문 1 - 날씨</title>
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="progress-container">
        <div class="progress-bar" style="width: 33%"></div>
      </div>
      <h2>지금 창밖의 날씨는 어때?</h2>
      <button class="btn" onclick="saveAndGo('weather', 'sunny')">
        ☀️ 햇살이 쨍쨍해
      </button>
      <button class="btn" onclick="saveAndGo('weather', 'rainy')">
        ☔ 비가 추적추적 와
      </button>
      <button class="btn" onclick="saveAndGo('weather', 'cloudy')">
        ☁️ 흐리고 선선해
      </button>
    </div>

    <script>
      function saveAndGo(key, value) {
        sessionStorage.setItem(key, value); // 데이터 저장
        location.href = "page2.html"; // 2화면으로 이동
      }
    </script>
  </body>
</html>
