<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>질문 4</title>
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="progress-container">
        <div class="progress-bar" style="width: 80%"></div>
      </div>
      <h2>지금은 어느 시간대야?</h2>
      <button class="btn" onclick="saveAndGo('time', 'morning')">
        🌅 상쾌한 아침
      </button>
      <button class="btn" onclick="saveAndGo('time', 'afternoon')">
        ☀️ 나른한 오후
      </button>
      <button class="btn" onclick="saveAndGo('time', 'evening')">
        🌆 노을 지는 저녁
      </button>
      <button class="btn" onclick="saveAndGo('time', 'night')">
        🌃 고요한 밤
      </button>
      <button class="btn" onclick="saveAndGo('time', 'dawn')">
        🌌 감성 터지는 새벽
      </button>
    </div>
    <script>
      function saveAndGo(k, v) {
        sessionStorage.setItem(k, v);
        location.href = "page5.html";
      }
    </script>
  </body>
</html>
